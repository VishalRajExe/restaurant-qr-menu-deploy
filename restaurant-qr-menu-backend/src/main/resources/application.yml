server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: restaurant-qr-backend

  # ─── Datasource ───────────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/restaurant_qr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      pool-name: RestaurantQRPool

  # ─── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update          # Use 'validate' in production after first run
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ─── Mail ─────────────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
          connectiontimeout: ${MAIL_SMTP_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_TIMEOUT:5000}


  # ─── Cache ────────────────────────────────────────────────────────────────────
  cache:
    type: simple

# ─── JWT ──────────────────────────────────────────────────────────────────────
# SECURITY: do not use a default secret in production. Set JWT_SECRET environment variable
# to a strong random value (minimum 32 characters recommended).
jwt:
  secret: ${JWT_SECRET:devSecretKeyForLocalTestingMustBe32BytesMinLength123456!}
  access-token-expiration: 900000        # 15 minutes (ms)
  refresh-token-expiration: 604800000    # 7 days (ms)

# ─── Cloudinary ───────────────────────────────────────────────────────────────
# SECURITY: override via CLOUDINARY_API_KEY and CLOUDINARY_API_SECRET in production.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:your_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}
  folder: restaurant-qr

# ─── QR Code ──────────────────────────────────────────────────────────────────
qr:
  base-url: ${QR_BASE_URL:${app.frontend-url:http://localhost:4200}/menu}
  image-width: 300
  image-height: 300

# ─── App ──────────────────────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  admin-url: ${ADMIN_URL:http://localhost:4201}
  mail:
    from: ${MAIL_FROM:${spring.mail.username:noreply@restaurantqr.com}}
    enabled: ${MAIL_ENABLED:true}


# ─── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.restaurantqr: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
