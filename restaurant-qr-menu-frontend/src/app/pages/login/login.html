<!-- ═══════════════════════════════════════════════════════════
     LEZATO — AUTHENTICATION & LOGIN
     ═══════════════════════════════════════════════════════════ -->
<div class="lezato-login-root">

  <!-- Left Showcase Image Panel -->
  <div class="lezato-login-hero"></div>

  <!-- Right Login Form Panel -->
  <div class="lezato-login-panel">
    <div class="login-box animate-fade-in">

      <!-- Header -->
      <div class="login-box-header">
        <h2 class="login-title">Welcome back</h2>
        <p class="login-subtitle">Sign in to your restaurant dashboard</p>
      </div>

      <!-- Role Selector Tabs -->
      <div class="login-role-selector">
        <button class="role-btn" [class.active]="activeTab() === 'owner'" (click)="setRoleTab('owner')" type="button">
          <span class="material-symbols-outlined text-[18px]">storefront</span>
          <span>Owner</span>
        </button>
        <button class="role-btn" [class.active]="activeTab() === 'chef'" (click)="setRoleTab('chef')" type="button">
          <span class="material-symbols-outlined text-[18px]">skillet</span>
          <span>Chef</span>
        </button>
        <button class="role-btn" [class.active]="activeTab() === 'super-admin'" (click)="setRoleTab('super-admin')" type="button">
          <span class="material-symbols-outlined text-[18px]">admin_panel_settings</span>
          <span>Admin</span>
        </button>
      </div>

      <!-- Error Message -->
      @if (errorMessage()) {
        <div class="login-error-alert">
          <span class="material-symbols-outlined text-[18px]">error</span>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-field">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="input-with-icon">
            <span class="material-symbols-outlined input-icon">mail</span>
            <input id="login-email"
                   class="lez-input"
                   type="email"
                   autocomplete="email"
                   placeholder="owner@restaurant.com"
                   [value]="email()"
                   (input)="email.set($any($event.target).value)"
                   required />
          </div>
        </div>

        <div class="form-field">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <label class="form-label" for="login-password" style="margin:0">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-with-icon">
            <span class="material-symbols-outlined input-icon">lock</span>
            <input id="login-password"
                   class="lez-input"
                   type="password"
                   autocomplete="current-password"
                   placeholder="Enter your password"
                   [value]="password()"
                   (input)="password.set($any($event.target).value)"
                   required />
          </div>
        </div>

        <div class="remember-row">
          <label class="remember-label">
            <input type="checkbox"
                   [checked]="rememberMe()"
                   (change)="rememberMe.set($any($event.target).checked)"
                   style="accent-color:#ab3500;width:16px;height:16px" />
            <span>Keep me logged in</span>
          </label>
        </div>

        <button class="lez-btn lez-btn-primary w-full"
                type="submit"
                id="login-submit-btn"
                style="padding:13px;font-size:15px;border-radius:10px"
                [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
            <span>Signing in...</span>
          } @else {
            <span>Sign In to Dashboard</span>
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
          }
        </button>
      </form>

      <!-- Signup Redirect -->
      <div class="login-footer">
        <p style="margin:0;font-size:13.5px;color:#594139">
          Don't have an account? 
          <a routerLink="/signup" class="signup-link">Register your restaurant</a>
        </p>
        <div style="margin-top:16px">
          <a routerLink="/" style="color:#8c9ba5;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:4px">
            <span class="material-symbols-outlined text-[16px]">arrow_back</span>
            Back to RestQR Home
          </a>
        </div>
      </div>

    </div>
  </div>

</div>
