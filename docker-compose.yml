version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: restaurant_qr_mysql
    restart: always
    environment:
      MYSQL_DATABASE: restaurant_qr_db
      MYSQL_USER: restaurant_user
      MYSQL_PASSWORD: restaurant_pass
      MYSQL_ROOT_PASSWORD: root_admin_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./restaurant-qr-menu-backend
      dockerfile: Dockerfile
    container_name: restaurant_qr_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql_db:3306/restaurant_qr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=restaurant_user
      - DB_PASSWORD=restaurant_pass
      - HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
    depends_on:
      mysql_db:
        condition: service_healthy

  frontend:
    build:
      context: ./restaurant-qr-menu-frontend
      dockerfile: Dockerfile
    container_name: restaurant_qr_frontend
    restart: always
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  mysql_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

